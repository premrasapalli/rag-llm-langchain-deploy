apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: no top-level `namespace:` field — every base resource declares
# `namespace: rag-llm-langchain` explicitly, so the deploy namespace is still rag-llm-langchain. This
# keeps the base/overlay split safe if a future overlay needs another namespace.
resources:
  - ../../base
# Prod overlay: pins the build to the real Artifact Registry repo.
#
# Set REGION and PROJECT_ID to your own values before deploying.
#   REGION=us-central1  PROJECT_ID=rag-llm-langchain
# If you use a different region/project, edit the newName entries below.
images:
  - name: rag-llm-langchain/model-loader
    newName: us-central1-docker.pkg.dev/rag-llm-langchain/rag-llm-langchain/model-loader
    newTag: "1.0.0"
  - name: rag-llm-langchain/rag
    newName: us-central1-docker.pkg.dev/rag-llm-langchain/rag-llm-langchain/rag
    newTag: "1.0.2"
  - name: rag-llm-langchain/gateway
    newName: us-central1-docker.pkg.dev/rag-llm-langchain/rag-llm-langchain/gateway
    newTag: "1.0.0"

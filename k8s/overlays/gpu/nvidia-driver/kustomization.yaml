apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kept WITHOUT a `namespace:` field on purpose: the driver DaemonSet must live
# in kube-system, not rag-llm-langchain. (The parent gpu overlay must therefore also not set
# a top-level namespace, or kustomize would rewrite this to rag-llm-langchain.)
resources:
  - nvidia-driver.yaml
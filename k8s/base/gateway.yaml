apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: genai
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: genai/gateway:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LLM_URL
              value: http://serving-llm:8000/v1
            - name: LLM_MODEL
              value: qwen2.5:0.5b
            - name: RAG_URL
              value: http://rag-service:8080
            - name: EMBED_URL
              value: http://serving-embedding:8001/v1
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: genai
type: Opaque
stringData:
  # Set your API key here (base64 not needed with stringData; kubectl will
  # encode it). Leave empty to keep auth disabled for testing. In production
  # generate a strong key and never commit it:
  #   kubectl create secret -n genai generic gateway-secret --from-literal=api-key=$(openssl rand -hex 24) -o yaml --dry-run=client > gateway-secret.yaml
  api-key: ""

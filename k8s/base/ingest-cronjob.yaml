apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-ingest
  namespace: rag-llm-langchain
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: seed-docs
              # Copies the single internal-data dump object from GCS into the
              # shared rag-data PVC before the ingest container indexes it.
              # Set DOCS_GCS_URI to the full GCS object path
              # (e.g. gs://rag-llm-langchain-docs/10-internal-data-dump.md) OR
              # remove this initContainer and copy the file into the PVC
              # manually (e.g. kubectl cp).
              image: google/cloud-sdk:slim
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  if [ -n "${DOCS_GCS_URI:-}" ]; then
                    echo "Seeding dump from ${DOCS_GCS_URI}"
                    mkdir -p /data/docs
                    gsutil cp "${DOCS_GCS_URI}" /data/docs/10-internal-data-dump.md
                  else
                    echo "DOCS_GCS_URI not set; using whatever is already in /data/docs"
                  fi
              env:
                - name: DOCS_GCS_URI
                  value: ""
                # The GKE workload identity service account must have
                # roles/storage.objectViewer on the bucket.
              volumeMounts:
                - name: rag-data
                  mountPath: /data
          containers:
            - name: ingest
              image: rag-llm-langchain/rag:1.0.0
              imagePullPolicy: Always
              command:
                - python
                - -m
                - ingest
                - --wipe
                - --paths
                - /data/docs/10-internal-data-dump.md
              env:
                - name: RAG_PERSIST_DIR
                  value: /data/chroma
                - name: EMBEDDING_BASE_URL
                  value: http://serving-embedding:8001
                - name: EMBEDDING_MODEL
                  value: BAAI/bge-small-en-v1.5
              volumeMounts:
                - name: rag-data
                  mountPath: /data
          volumes:
            - name: rag-data
              persistentVolumeClaim:
                claimName: rag-data
